{% extends 'base.html' %}

{% block content %}
  <h2>Cadastrar Produto para {{ fornecedor.nome_empresa }}</h2>
  <form method="post" class="form-cadastro">
  {% csrf_token %}
  <div class="form-group">
    <label for="{{ form.nome.id_for_label }}">Produto</label>
    {{ form.nome }}
  </div>
  <div class="form-group">
    <label for="{{ form.preco.id_for_label }}">Preço</label>
    {{ form.preco }}
    {% if form.preco.errors %}
    <div class="text-danger">
      {% for error in form.preco.errors %}
        <small>{{ error }}</small>
      {% endfor %}
    </div>
  {% endif %}

  </div>
  <div class="form-group">
    <label for="{{ form.descricao.id_for_label }}">Descrição</label>
    {{ form.descricao }}
  </div>

  <button type="submit" class="btn btn-primary">Salvar</button>
</form>
{% endblock %}
