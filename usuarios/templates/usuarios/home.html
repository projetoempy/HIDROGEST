<!DOCTYPE html>
<html>
<head>
  <title>HIDROMANAGER</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }/*
    * {
      box-sizing: border-box;
    }*/


    .alerta {
      background-color: #f8d7da;
      color: #721c24;
    }
    table {
      width: 100%;
      border: 1px solid #ccc;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
    }
    .centro{
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Bem-vindo ao HIDROMANAGER</h1>

  <a href="{% url 'login' %}">Login</a> |
  <a href="{% url 'cadastro_funcionario' %}">Cadastrar Funcionário</a>

  <h2>Produtos em Estoque</h2>
  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
      </tr>
    </thead>
    <tbody>
      {% for item in produtos_estoque %}
        <tr class="{% if item.quantidade < item.quantidade_minima %}alerta{% endif %}">
          <td>{{ item.produto.nome }}</td>
          <td class="centro">{{ item.quantidade }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="2">Nenhum produto cadastrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
